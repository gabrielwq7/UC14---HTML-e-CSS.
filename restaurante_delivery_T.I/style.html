<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Flash - Site em Construção</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;

    /* Coloque sua imagem aqui */
    background:
        linear-gradient(rgba(0,0,0,.60), rgba(0,0,0,.60)),
        url("images/construcao.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.container{
    background:rgba(0,0,0,.45);
    padding:50px;
    border-radius:20px;
    backdrop-filter:blur(5px);
}

h1{
    font-size:4rem;
    margin-bottom:20px;
}

p{
    font-size:1.5rem;
    margin-bottom:35px;
}

a{
    display:inline-block;
    padding:15px 35px;
    background:#ff0000;
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-weight:bold;
    transition:.3s;
}

a:hover{
    background:#b30000;
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">
    <h1>🚧 Site em Construção 🚧</h1>
    <p>Em breve você poderá fazer seus pedidos online.</p>

    <a href="index.html">Voltar ao início</a>
</div>

</body>
</html>
