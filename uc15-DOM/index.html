<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
    <h1 id="title">meu planejador de estudos</h1>

    <h2>nova tarefa</h2>

    <input type="text" id="tarefa" placeholder="Digite sua tarefa">

    <input type="text" id="materia" placeholder="Digite a matéria">

    <select id="prioridade">
        <option value="">Selecione a prioridade</option>
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa</option>
    </select>

    <button onclick="adicionarTarefa()">
        cadastrar Tarefa
    </button>

  <button onclick="limparTarefas()">
        Limpar campos
</button>

<p id="mensagem"></p>

 <div class="contadores">

    <p id="contador"> tarefas cadastradas: 0</p>
    <p id="contadorconcluidas"> tarefas concluídas: 0</p>
 </div>

  <button onclick="alternadormodo()">
    modo de concentração
  </button>

  <h2>minhas tarefas</h2>

  <div id="listatarefas"></div>

 </div>

<script src="script.js"></script>

</body>

</html>
